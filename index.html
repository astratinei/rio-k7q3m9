.fl-right .holi b{color:var(--amarelo);font-weight:700}

  .flag-in{grid-template-columns:1fr;justify-items:center;text-align:center;padding-block:14px 16px}
  .emblem{order:-1;max-width:320px}
  .fl-left,.fl-right{justify-self:center;justify-items:center}
  .fl-right .holi{text-align:center}
}

.wrap{max-width:1500px;margin:0 auto;padding-block:12px 110px}

/* toolbar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:4px}
.daynav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 320px;min-width:0;padding-block:6px}
.daynav::-webkit-scrollbar{display:none}
.daynav button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:650 13px/1 var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.daynav button small{font:500 11px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.daynav button.hl{border-color:var(--party);color:var(--party)}
.daynav button.hol{border-color:var(--culture)}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.offbar{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font:600 13px/1.4 var(--body)}
.offbar b{font-weight:800}
.offsheet h4{margin:16px 0 6px}.offsheet h4:first-child{margin-top:0}.offsheet .row{margin:6px 0 4px}
.offsheet label{display:grid;gap:6px;font:650 13px/1.3 var(--body);color:var(--muted)}.offsheet input[type=password]{width:100%;font:500 16px var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.offsheet ol{margin:6px 0 12px;padding-left:20px}.offsheet li{margin:4px 0}
.phx-out{display:grid;gap:14px;margin-top:10px}.phx-out figure{margin:0;display:grid;gap:6px}.phx-out img{width:100%;height:auto;border:1.5px solid var(--line);border-radius:10px;background:#fff}.phx-out figcaption{font:650 13px/1.35 var(--body)}
.offsheet .prog{font:600 13px/1.4 var(--body);color:var(--muted);min-height:1.4em}.offsheet .prog.err{color:var(--bad)}

/* board */
.board{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-block:8px 16px;overscroll-behavior-x:contain}
.col{flex:0 0 min(292px,82vw);background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;min-width:0}
.col.anniv{border-color:var(--party)}
.col.hol{border-top:6px solid var(--amarelo)}
.chead{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:end}
.chead .dow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);grid-column:1}
.chead .num{font:400 46px/.9 var(--display);grid-column:1;color:var(--ink)}
.col.anniv .chead .num{color:var(--party)}
.chead .num small{font:500 12px/1 var(--mono);letter-spacing:.06em;margin-left:4px;color:var(--muted)}
.chead .dtags{grid-column:2;grid-row:1 / span 2;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;align-self:start}
.dtag{font:650 11px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--cbg);color:var(--cink);white-space:nowrap}
.dnote{display:grid;gap:6px}
.dnote p{margin:0;font-size:13px;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.dnote textarea{font-size:14px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:64px;resize:vertical;width:100%;color:var(--ink)}
.alts{display:grid;gap:6px}
.alts:empty{display:none}
.alt-tabs{display:flex;flex-wrap:wrap;gap:4px}
.alt-tabs button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 10px;font:650 12.5px/1.1 var(--body);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alt-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.alt-row input{flex:1 1 120px;min-width:0;font-size:14px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--ink)}
.lnk.del{color:var(--danger)}
.lnk{border:0;background:none;padding:0;color:var(--accent);font:650 12.5px/1.2 var(--body);cursor:pointer;justify-self:start}
.slot{display:grid;gap:6px}
.slot h3{margin:0;display:flex;align-items:center;justify-content:space-between;font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.slot-btns{display:flex;gap:6px;align-items:center}
.slot-home{display:none;border:1.5px solid var(--line);background:var(--surface);color:var(--stay-bg);border-radius:999px;height:26px;padding:0 9px;font:700 15px/1 var(--body);cursor:pointer;place-items:center}
.has-home .slot-home{display:grid}
.card .k .tm{margin-left:auto;font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--cink);background:var(--surface);border-radius:999px;padding:3px 7px}
.card.cat-stay .k .tm{background:var(--cink);color:var(--cbg)}
.timerow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:650 13px/1.2 var(--body)}
.timerow input{font:600 15px var(--body);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--ink)}
.slot-add{border:1.5px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;width:26px;height:26px;font:700 16px/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0}
.list{display:flex;flex-direction:column;gap:6px;min-height:50px;border-radius:12px;padding:4px;border:1.5px dashed transparent;transition:border-color .15s}
.list:empty{border-color:var(--line)}
.col .list:empty::before{content:attr(data-empty);font-size:12.5px;color:var(--muted);margin:auto;padding:10px 0;text-align:center}

/* cards */
.card{--cbg:var(--misc-bg);--cink:var(--misc);background:var(--cbg);color:var(--ink);border-radius:12px;display:grid;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:1.5px solid transparent;transition:transform .12s,opacity .15s;min-width:0;flex-shrink:0}
.card:hover{border-color:var(--cink)}
.card:active{cursor:grabbing}
.card .ph{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--raise);pointer-events:none}
.card .cb{padding:9px 10px 10px;display:grid;gap:4px;min-width:0}
.card .k{display:flex;align-items:center;gap:6px;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cink)}
.card .k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cink);flex:0 0 auto}
.card .t{font:700 14.5px/1.25 var(--body);overflow-wrap:anywhere}
.card .m{font-size:12.5px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.cat-stay .m,.card.cat-stay .t{color:var(--cink)}
.card.cat-stay .k::before{border-radius:2px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pill{font:650 11px/1 var(--body);padding:4px 7px;border-radius:999px;background:var(--surface);color:var(--cink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.when{background:transparent;border:1px solid var(--cink)}
.pill.also,.pill.on{background:var(--cink);color:var(--cbg)}
.leg{display:grid;gap:1px;padding:4px 10px 6px;border-top:1.5px dashed var(--cink);min-width:0}
.legl{display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:0}
.legbtn{border:0;background:none;padding:3px 0;margin:0;color:var(--cink);font:600 12px/1.3 var(--body);text-align:left;cursor:pointer;min-width:0;flex:1 1 auto;text-decoration:underline dotted;text-underline-offset:3px}
.legbtn span{display:block;overflow-wrap:anywhere}
.legl a{color:var(--cink);font:750 12px/1.3 var(--body);flex:0 0 auto}
.card.has-g{grid-template-columns:50px minmax(0,1fr)}
.card.has-g>.cmain{display:grid;min-width:0}
.g{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;background:var(--surface);border-right:1.5px solid var(--line);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0;text-align:center}
.card.cat-stay .g{background:rgba(255,255,255,.12);border-right-color:rgba(255,255,255,.25)}
.g .gt{font:600 11px/1.1 var(--mono);color:var(--ink)}
.card.cat-stay .g .gt,.card.cat-stay .g .gtmp{color:var(--cink)}
.g.est .gt{color:var(--muted);font-weight:500}
.g .gi{font-size:17px;line-height:1.2}
.g .gtmp{font:700 12.5px/1 var(--body);color:var(--ink)}
.g .gr{font:600 10.5px/1.1 var(--body);color:var(--beach)}
.card.cat-stay .g .gr{color:var(--cink)}
.g.wet{background:var(--beach-bg)}
.g .gna{font-size:9.5px;line-height:1.15;color:var(--muted)}
.orrow.has-g{grid-template-columns:50px minmax(0,1fr);padding:0;overflow:hidden}
.orrow.has-g>.g{border-radius:0}
.orrow.has-g>.ormain{display:grid;gap:5px;padding:6px;min-width:0}
.orrow{display:grid;gap:5px;border:1.5px dashed var(--muted);border-radius:14px;padding:6px;flex-shrink:0;min-width:0}
.orcap{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 2px 0}
.orcards{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;min-width:0}
.orcards>.card{flex:1 0 126px;min-width:126px}
.orcards .card .t{font-size:13.5px}
.orcards .legbtn span{white-space:normal}
.fly{background:var(--raise);border-radius:12px;padding:10px 12px;display:grid;gap:10px;--cink:var(--ink)}
.flyc{display:grid;gap:3px}
.flyc p{margin:0;font-size:13px;line-height:1.35;color:var(--ink)}
.flyt{font:750 14px/1.25 var(--body)}
.flyleave{font-size:14px!important}
.flyc .flynote{font-size:12px;color:var(--muted)}
.flyc .legl{border-top:1.5px dashed var(--line);padding-top:3px;margin-top:2px}
.lms{display:grid;gap:6px}
.lm{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;cursor:pointer;color:var(--ink);font:650 14px/1.2 var(--body);text-align:left}
.lm span{font-weight:500;color:var(--muted);font-size:13.5px}
.lm[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.lm[aria-pressed="true"] span{color:var(--accent-ink)}
.lm:disabled{cursor:default}
.instbar .row{gap:6px}
.wx{display:grid;gap:5px;background:var(--raise);border-radius:12px;padding:8px 10px;min-width:0}
.wxsum{display:flex;align-items:baseline;gap:7px;font:400 14px/1.2 var(--body)}
.wxsum .wxi{font-size:20px;align-self:center}
.wxsum b{font:750 18px/1 var(--body)}
.wxsum .wxlo{color:var(--muted)}
.wxsum .wxp{margin-left:auto;font:650 12.5px/1 var(--body);color:var(--beach)}
.wxtxt{margin:0;font-size:12px;line-height:1.35;color:var(--muted)}
.wxh{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;overscroll-behavior-x:contain}
.wxc{flex:0 0 auto;display:grid;justify-items:center;gap:1px;background:var(--surface);border-radius:9px;padding:4px 6px;min-width:40px;font-variant-numeric:tabular-nums}
.wxc small{font:500 10px/1.2 var(--mono);color:var(--muted)}
.wxc span{font-size:15px;line-height:1.1}
.wxc b{font:700 12.5px/1.1 var(--body)}
.wxc.wet{background:var(--beach-bg)}
.wxc.wet small:last-child{color:var(--beach);font-weight:700}
.wxsrc{font-size:10.5px;color:var(--muted)}
.hrs table{border-collapse:collapse;font-size:13.5px;margin-top:2px}
.hrs th{text-align:left;font-weight:650;padding:2px 14px 2px 0;color:var(--muted)}
.hrs td{padding:2px 0;font-variant-numeric:tabular-nums}
.hrs tr.cl td{color:var(--bad)}
.hrs small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.hrs .hn{margin:6px 0 0;font-size:13px}
.pill.buy{background:var(--shop);color:var(--shop-bg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.item.got{opacity:.55}
.item .itph{border:0;padding:0;margin:0;background:var(--shop-bg);cursor:pointer;display:block;width:100%;aspect-ratio:1/1;overflow:hidden;color:var(--shop);font:400 34px/1 var(--display)}
.item .itph.noimg{aspect-ratio:5/2;font-size:26px}
.item .itph img{width:100%;height:100%;object-fit:cover;display:block}
.item .itb{padding:9px 10px 11px;display:grid;gap:5px;align-content:start;min-width:0}
.itchk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font:700 14.5px/1.25 var(--body);overflow-wrap:anywhere}
.itchk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.item.got .itn{text-decoration:line-through}
.itnote{margin:0;font-size:12.5px;line-height:1.35;color:var(--muted);overflow-wrap:anywhere}
.itshops{display:flex;flex-wrap:wrap;gap:4px}
.itshops button,.shoplink{border:0;cursor:pointer;font:650 11.5px/1.2 var(--body);padding:5px 8px;border-radius:999px;background:var(--cbg);color:var(--cink);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buyb{display:grid;gap:6px;background:var(--shop-bg);border-radius:12px;padding:10px 12px}
.buyb b{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--shop)}
.buyb label{display:flex!important;gap:8px;align-items:center;font:650 14px/1.3 var(--body)!important;color:var(--ink)!important}
.buyb input{width:18px;height:18px;accent-color:var(--accent)}
.buyb .lnk{justify-self:start}
.itphoto{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.itphoto .prev{width:110px;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--shop-bg);display:grid;place-items:center;color:var(--shop);font-size:30px}
.itphoto .prev img{width:100%;height:100%;object-fit:cover}
.selshops{display:flex;flex-wrap:wrap;gap:6px}
.selshops .sel{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:6px 9px;font:650 12.5px/1 var(--body);background:var(--cink);color:var(--cbg);cursor:pointer}
.shopres{display:grid;gap:5px;max-height:260px;overflow-y:auto}
.instbar{flex-direction:column;align-items:flex-start;text-align:left}
.sheet label.timerow{display:flex;color:var(--ink)}
.card.cat-stay .pill{background:var(--cink);color:var(--cbg)}
.pills.cat-stay .pill{background:var(--stay-bg);color:var(--stay)}
.instbar>span,.instbar .row{justify-content:flex-start;text-align:left}
.card.dim{opacity:.3}
.ghost{opacity:.35}
.chosen{border-color:var(--cink)}
.dragging{transform:rotate(1.5deg);box-shadow:0 10px 24px rgba(0,0,0,.2)}

.cat-stay{--cbg:var(--stay-bg);--cink:var(--stay)}
.cat-party{--cbg:var(--party-bg);--cink:var(--party)}
.cat-bar{--cbg:var(--bar-bg);--cink:var(--bar)}
.cat-beach{--cbg:var(--beach-bg);--cink:var(--beach)}
.cat-hike{--cbg:var(--hike-bg);--cink:var(--hike)}
.cat-trip{--cbg:var(--trip-bg);--cink:var(--trip)}
.cat-culture{--cbg:var(--culture-bg);--cink:var(--culture)}
.cat-food{--cbg:var(--food-bg);--cink:var(--food)}
.cat-sweet{--cbg:var(--sweet-bg);--cink:var(--sweet)}
.cat-shop{--cbg:var(--shop-bg);--cink:var(--shop)}
.cat-misc{--cbg:var(--misc-bg);--cink:var(--misc)}

/* sections */
.sec{display:grid;gap:12px;padding-top:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
h2{font:400 38px/1 var(--display);margin:0;color:var(--accent)}
h2 small{font:500 13px/1 var(--mono);color:var(--muted);margin-left:10px;letter-spacing:0;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 12px;min-width:0;flex:1 1 200px;max-width:320px}
.search input{border:0;background:transparent;font-size:14px;padding:9px 0;min-width:0;width:100%;outline:none}
.search svg{flex:0 0 auto;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font:700 13.5px/1 var(--body);cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.armed{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-ink)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font:650 12.5px/1 var(--body);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font:650 12.5px/1 var(--body);cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--cink);display:block}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;border:1.5px solid var(--cink)}
.chip.toggle[aria-pressed="false"]{opacity:1}
.chip.toggle[aria-pressed="true"],.chip.mf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.chip.mf[aria-pressed="false"]{opacity:1}
.empty{margin:0;padding:22px;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.lane{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:12px;display:grid;gap:8px;min-width:0}
.lane header{display:flex;align-items:center;gap:8px;font:750 15px/1.2 var(--body);color:var(--cink)}
.lane.zone header{color:var(--ink)}
.lane.cat-stay header{color:var(--stay-bg)}
.lane.cat-stay header i,.chip.cat-stay i{background:var(--stay-bg)}
.chip.cat-stay[aria-pressed="false"] i{background:transparent;border-color:var(--stay-bg)}
.lane header i{width:10px;height:10px;border-radius:50%;background:var(--cink);display:block;flex:0 0 auto}
.lane.zone header i{border-radius:2px;background:var(--verde)}
.lane header small{margin-left:auto;font:500 12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.lane .list{max-height:480px;overflow-y:auto;overscroll-behavior:contain}
.lane .list:empty::before{content:"Nothing here yet";font-size:12.5px;color:var(--muted);margin:auto;padding:10px 0}
.lane .lane-add{justify-self:start}

/* map */
.mapwrap{position:relative;height:min(64vh,580px);min-height:360px;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:var(--water)}
.minimap{position:relative;height:260px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:var(--water)}
.mapsvg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapsvg:active{cursor:grabbing}
.minimap .mapsvg{cursor:crosshair}
.m-land{fill:var(--land);stroke:var(--coast);stroke-width:1;fill-rule:evenodd}
.m-lagoa{fill:var(--water);stroke:var(--coast);stroke-width:1}
.m-lab{font:600 11.5px var(--body);fill:var(--maplabel);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.m-lab.w{fill:var(--waterlabel);stroke:var(--water);font-style:italic;font-weight:500;letter-spacing:.06em}
.m-plab{font:650 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.m-ctl button[data-z="lab"][aria-pressed="false"]{opacity:.55}
.m-route{fill:none;stroke:var(--route);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round;opacity:.75}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .b{fill:var(--cink);stroke:var(--surface);stroke-width:2}
.pin.cat-stay .b{fill:var(--azul);stroke:var(--amarelo);stroke-width:2.5}
.pin .num{font:800 11px var(--body);fill:var(--surface);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.cat-stay .num{fill:var(--amarelo)}
.pin.ap .num{fill:var(--cink)}
.pin.sel .b{stroke:var(--ink);stroke-width:3}
.pin.ap .b{fill:var(--cbg);stroke:var(--cink);stroke-width:2.5}
.m-pickpin .b{fill:var(--bad);stroke:var(--surface);stroke-width:2.5}
.m-ctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.m-ctl button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:700 17px/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.m-ctl button.fit{font-size:11px;font-weight:700}
.m-pop{position:absolute;z-index:3;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:grid;gap:4px;width:max-content;max-width:min(260px,80%);transform:translate(-50%,calc(-100% - 16px))}
.m-pop.below{transform:translate(-50%,16px)}
.m-pop b{font:750 14px/1.25 var(--body);overflow-wrap:anywhere}
.m-pop small{font-size:12px;color:var(--muted)}
.m-pop .row{margin-top:4px}
.m-note{position:absolute;left:10px;bottom:10px;margin:0;font-size:12px;color:var(--ink);background:var(--surface);border-radius:10px;padding:6px 9px;max-width:calc(100% - 20px);opacity:.92}
.m-note:empty{display:none}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);color:var(--ink);width:min(620px,100%);max-height:90vh;overflow-y:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.22)}

.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .row{display:flex;gap:8px;align-items:center}
.x{border:0;background:var(--raise);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:19px;line-height:1;flex:0 0 auto;color:var(--ink)}
.sheet h4{margin:0;font:800 26px/1.1 var(--body);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.sheet .meta{color:var(--muted);font-size:14px;margin:-4px 0 0}
.sheet p{margin:0;max-width:62ch;overflow-wrap:anywhere}
.sheet ul{margin:0;padding-left:20px;display:grid;gap:6px}
.instbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--raise);border-radius:12px;padding:8px 10px;font:650 13px/1.3 var(--body)}
.gtk{background:var(--raise);border-radius:12px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.gtk b{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.links{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.links a,.links .lnk{color:var(--accent);font-weight:700;font-size:14px}
.who{font-size:12.5px;color:var(--muted)}
.locline{font-size:13px;color:var(--muted)}
.sheet h5{margin:6px 0 0;font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint2{font-size:13px;color:var(--muted);margin:-4px 0 0}
.movegrid{display:grid;grid-template-columns:62px repeat(3,minmax(0,1fr));gap:5px;align-items:center}
.movegrid span{font:650 12.5px/1 var(--body);font-variant-numeric:tabular-nums}
.movegrid span.hl{color:var(--party)}
.movegrid .gnew{display:block;border:0;background:none;padding:2px 0 0;color:var(--accent);font:650 11px/1.2 var(--body);cursor:pointer;text-align:left}
.movegrid .gplan{display:block;font:600 10.5px/1.2 var(--body);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{display:grid;gap:6px}
.pk{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 11px;cursor:pointer;color:var(--ink);width:100%}
.pk i{width:10px;height:10px;border-radius:50%;background:var(--cink);flex:0 0 auto}
.pk.cat-stay i{background:var(--stay-bg)}
.pk span{display:grid;gap:2px;min-width:0}
.pk b{font:700 14px/1.25 var(--body);overflow-wrap:anywhere}
.pk small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk:disabled{opacity:.45;cursor:default}
.movegrid button{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font:650 12px/1.1 var(--body);cursor:pointer;min-width:0;color:var(--ink)}
.movegrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.movegrid.toggle button[aria-pressed="true"]::before{content:"✓ "}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.split{justify-content:space-between}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gal figure{margin:0;display:grid;gap:4px;min-width:0}
.gal .phb{padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--raise);display:block;width:100%}
.gal .phb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.gal .pha{display:flex;gap:4px;flex-wrap:wrap}
.gal .pha button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 9px;font:650 11.5px/1 var(--body);cursor:pointer;color:var(--ink)}
.gal .pha button.armed{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-ink)}
.gal .cover{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);align-self:center;padding:0 4px}
.addph{border:1.5px dashed var(--line);background:var(--bg);border-radius:12px;min-height:96px;cursor:pointer;font:700 13.5px/1.2 var(--body);color:var(--accent);display:grid;place-items:center;padding:10px;text-align:center}
.gstat{font-size:13px;color:var(--muted);margin:0}
.gstat:empty{display:none}
.gstat.err{color:var(--bad)}
.ph-missing{display:grid;place-items:center;aspect-ratio:4/3;font-size:12px;color:var(--muted);background:var(--raise);border-radius:12px}

/* form */
.sheet form{display:grid;gap:12px}
.sheet label{display:grid;gap:5px;font:650 12.5px/1.2 var(--body);color:var(--muted)}
.sheet input[type=text],.sheet input[type=url],.sheet select,.sheet textarea{font-size:15px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0;color:var(--ink)}
.sheet textarea{min-height:80px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
legend{font:650 12.5px/1.2 var(--body);color:var(--muted);padding:0;margin-bottom:5px}
.light{font-weight:500}
.daychk{display:flex;flex-wrap:wrap;gap:5px}
.daychk label{display:inline-flex;gap:0;align-items:center;cursor:pointer;position:relative}
.daychk input{position:absolute;opacity:0;width:1px;height:1px}
.daychk span{border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;font:650 12.5px/1 var(--body);color:var(--ink);background:var(--bg)}
.daychk input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daychk input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.qtags{display:flex;flex-wrap:wrap;gap:5px}
.qtags button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 9px;font:650 12px/1 var(--body);cursor:pointer;color:var(--ink)}
.qtags button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ferr{color:var(--bad);font-size:13px;margin:0}
.ferr:empty{display:none}
.lochint{font-size:12.5px;color:var(--muted);margin:0}

/* floating add */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:750 15px/1 var(--body);padding:15px 20px;box-shadow:0 8px 22px rgba(0,0,0,.25);cursor:pointer}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:70;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

function pad2(n){ return (n < 10 ? "0" : "") + n; }
function offPhotoIds(){

function shrinkUrl(id){
  return new Promise(function(res){
    var img = new Image(), done = false;
    var to = setTimeout(function(){ if (!done){ done = true; res(null); } }, 20000);
    img.onload = function(){
      if (done) return; done = true; clearTimeout(to);
      try{
        var w = img.naturalWidth, h = img.naturalHeight, m = 1000, s = Math.min(1, m / Math.max(w, h || 1));
        var cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", 0.72));
      }catch(e){ res(null); }
    };
    img.onerror = function(){ if (!done){ done = true; clearTimeout(to); res(null); } };
    img.src = "/_blob/" + encodeURIComponent(id);
  });
}
function packPhotos(ids, prog){
  var out = {}, i = 0, n = 0, missed = 0;
  return new Promise(function(res){
    if (!ids.length){ res({photos:out, missed:0}); return; }
    function next(){
      if (i >= ids.length) return;
      var id = ids[i++];
      shrinkUrl(id).then(function(u){
        if (u) out[id] = u; else missed++;
        n++; prog(n, ids.length);
        if (n === ids.length) res({photos:out, missed:missed}); else next();
      });
    }
    for (var k = 0; k < 4; k++) next();
  });
}
function deepCopy(o){ return JSON.parse(JSON.stringify(o || {})); }
function makeOffline(prog){
  var tplEl = document.getElementById("offlineTpl");
  if (!tplEl) return Promise.reject({code:"no_template"});
  var tpl = JSON.parse(tplEl.textContent), mark = "__OFF" + "LINE_DATA__";
  if (tpl.split(mark).length !== 2) return Promise.reject({code:"bad_template"});
  var data = {cards:deepCopy(S.cards), plan:deepCopy(S.plan), alts:deepCopy(S.alts), legs:deepCopy(S.legs), items:deepCopy(S.items), weather:deepCopy(S.wx), days:deepCopy(S.days)};
  return packPhotos(offPhotoIds(), prog).then(function(r){
    var payload = {savedAt:Date.now(), data:data, photos:r.photos};
    var json = JSON.stringify(payload).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
    var parts = tpl.split(mark);
    return {html:parts[0] + json + parts[1], missed:r.missed, photos:Object.keys(r.photos).length};

}

function phxIds(){

function phxLoad(id){
  var url = "/_blob/" + encodeURIComponent(id);
  function viaImg(src){ return new Promise(function(res, rej){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = src; }); }
  return fetch(url).then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.blob(); })
    .then(function(b){ var u = URL.createObjectURL(b); return viaImg(u).then(function(im){ im._u = u; return im; }); })
    .catch(function(){ return viaImg(url); });
}
function phxSheet(ids, idx, count){
  var C = PHX.cell, rows = Math.ceil(ids.length / PHX.cols);
  var cv = document.createElement("canvas"); cv.width = PHX.cols * C; cv.height = PHX.strip + rows * C;
  var g = cv.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, cv.width, cv.height);
  var sizes = [], i = 0, missed = 0;
  function one(){
    if (i >= ids.length) return Promise.resolve();
    var k = i++;
    return phxLoad(ids[k]).then(function(im){
      var w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, C / Math.max(w, h)), dw = Math.max(1, Math.round(w * s)), dh = Math.max(1, Math.round(h * s));
      g.drawImage(im, (k % PHX.cols) * C, PHX.strip + Math.floor(k / PHX.cols) * C, dw, dh);
      if (im._u) URL.revokeObjectURL(im._u);
      sizes[k] = [dw, dh];
    }, function(){ sizes[k] = [0, 0]; missed++; }).then(one);
  }
  return one().then(function(){
    var bytes = [82, 73, 79, 49, idx, count, ids.length];
    ids.forEach(function(id, k){
      for (var j = 0; j < 32; j += 2) bytes.push(parseInt(id.substr(j, 2), 16));
      bytes.push(sizes[k][0] >> 8, sizes[k][0] & 255, sizes[k][1] >> 8, sizes[k][1] & 255);
    });
    var sum = 0; bytes.forEach(function(b){ sum = (sum + b) & 255; }); bytes.push(sum);
    var B = PHX.blk, perRow = Math.floor(cv.width / B), n = 0;
    g.fillStyle = "#000000";
    bytes.forEach(function(b){ for (var bit = 7; bit >= 0; bit--){ if ((b >> bit) & 1) g.fillRect((n % perRow) * B, B + Math.floor(n / perRow) * B, B, B); n++; } });
    return new Promise(function(res){ cv.toBlob(function(bl){ res({blob:bl, missed:missed}); }, "image/jpeg", 0.92); });
  });
}
function openPhotoExport(){

  sheet.querySelector(".x").addEventListener("click", closeSheet);

      if (k >= count){ prog.textContent = "Done: " + count + " image" + (count === 1 ? "" : "s") + " below." + (missed ? " " + missed + " photo" + (missed === 1 ? "" : "s") + " couldn’t be read." : ""); btn.disabled = false; return; }

        out.appendChild(f); k++; setTimeout(next, 30);

function galStatus(id, msg, err){
  if (!sheetState || sheetState.mode !== "view" || sheetState.id !== id) return;
  var st = sheet.querySelector("#sgstat"); if (!st) return;
  st.textContent = msg || ""; st.classList.toggle("err", !!err);
}
function decode(file){
  function viaImg(){ return new Promise(function(res, rej){ var u = URL.createObjectURL(file), im = new Image(); im.onload = function(){ res(im); setTimeout(function(){ URL.revokeObjectURL(u); }, 2000); }; im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error("decode")); }; im.src = u; }); }
  return window.createImageBitmap ? createImageBitmap(file).catch(viaImg) : viaImg();
}
function shrink(file){
  if (file.type === "image/gif") return Promise.resolve(file);
  return decode(file).then(function(img){
    var w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
    if (!w || !h) return file;
    var s = Math.min(1, 1600 / Math.max(w, h));
    if (s === 1 && ALLOWED[file.type] && file.size < 1500000) return file;
    var cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
    var cx = cv.getContext("2d"); cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    return new Promise(function(res){ cv.toBlob(function(b){ res(b && b.size ? b : file); }, "image/jpeg", 0.85); });
  }, function(){ return file; });
}
function photoErr(e){
  var code = e && e.code;
  return {offline:"You’re offline. Photos can be added when you’re back online.", no_key:"Turn on Sync first (button at the top) to add photos.", too_large:"That photo is over 20 MB. Try a smaller one.", unsupported_type:"That file type isn't supported. Use a JPEG, PNG, WebP or GIF.", quota_or_state:"Photo storage for this page is full. Remove some photos first.", rate_limited:"Too many uploads at once. Wait a minute and try again.", upstream_auth:"Your session expired. Reload the page and try again.", not_granted:"Adding photos needs edit access to this page.", capability_disabled:"Photos can't be added in this view."}[code] || "Couldn't upload that photo. Try again.";
}
function uploadPhotos(id, files){
  if (!assets || !canWrite || uploading[id]) return;
  files = files.filter(function(f){ return /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name || ""); });
  if (!files.length){ galStatus(id, "Pick image files: JPEG, PNG, WebP or GIF.", true); return; }
  uploading[id] = true;
  var i = 0, okN = 0, err = null;
  function next(){
    if (i >= files.length){ delete uploading[id]; galStatus(id, err ? (okN ? okN + " added. " + err : err) : (okN === 1 ? "Photo added" : okN + " photos added"), !!err); return; }
    var f = files[i++];
    galStatus(id, "Uploading " + i + " of " + files.length + "…");
    shrink(f).then(function(b){
      var t = ALLOWED[b.type] ? b.type : (ALLOWED[f.type] ? f.type : null);
      if (!t) throw {code:"unsupported_type"};
      return assets.upload(b, {type:t});
    }).then(function(r){
      okN++;
      var cur = S.cards[id];
      if (!cur){ assets.delete(r.id).catch(function(){}); return; }
      var ph = (Array.isArray(cur.photos) ? cur.photos : []).slice(); ph.push(r.id);
      S.cards[id] = Object.assign({}, cur, {photos:ph});
      fill(); writeCard(id);
    }).catch(function(e){ err = photoErr(e); }).then(next);
  }
  next();
}
function setCover(id, p){
  var cur = S.cards[id]; if (!cur || !canWrite) return;
  var ph = (cur.photos || []).filter(function(x){ return x !== p; }); ph.unshift(p);
  S.cards[id] = Object.assign({}, cur, {photos:ph}); fill(); writeCard(id);
}
function removePhoto(id, p){
  var cur = S.cards[id]; if (!cur || !canWrite) return;
  S.cards[id] = Object.assign({}, cur, {photos:(cur.photos || []).filter(function(x){ return x !== p; })});
  fill(); writeCard(id);
  if (assets){
    var still = Object.keys(S.cards).some(function(cid){ return (S.cards[cid].photos || []).indexOf(p) !== -1; });
    if (!still) assets.delete(p).catch(function(){});
  }
  galStatus(id, "Photo removed");
}

(function connect(){
  var c = window.claude;
  function none(){ conn = "none"; setStatus("none"); fill(); }
  if (!c || typeof c.use !== "function"){ none(); return; }
  function snapErr(){ setStatus("error", "Lost the connection. Reload to see the latest board."); }
  function after(){ if (!OFF && !APP) document.getElementById("phxBtn").hidden = !phxIds().length; if (got.cards && got.plan && conn !== "ready"){ conn = "ready"; if (!pend && !lastErr && canWrite) setStatus("saved"); } fill(); }
  c.use("db").then(function(ns){
    if (!ns){ none(); return; }
    db = ns;
    db.collection("cards").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists){ var v = d.data(); if (v && typeof v === "object") m[d.id] = v; } });
      S.cards = m; got.cards = true; after();
    }, snapErr);
    db.collection("plan").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists){ var v = d.data(); if (v && v.card) m[d.id] = v; } });
      S.plan = m; got.plan = true; after();
    }, snapErr);
    db.collection("weather").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists){ var v = d.data(); if (v && typeof v === "object") m[d.id] = v; } });
      S.wx = m; fill();
    }, function(){});
    db.collection("items").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists){ var v = d.data(); if (v && typeof v.name === "string") m[d.id] = v; } });
      S.items = m; fill();
    }, function(){});
    db.collection("legs").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists){ var v = d.data(); if (v && MODES[v.mode]) m[d.id] = {mode:v.mode}; } });
      S.legs = m; fill();
    }, function(){});
    db.collection("alts").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists){ var v = d.data(); if (v && Array.isArray(v.opts)) m[d.id] = {opts:v.opts}; } });
      S.alts = m; fill();
    }, function(){});
    db.collection("days").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists){ var v = d.data(); if (v && typeof v.note === "string") m[d.id] = {note:v.note}; } });
      S.days = m; fill();

    c.use("assets").then(function(a){ assets = a || null; refreshSheet(true); }).catch(function(){});
    if (!OFF && document.getElementById("offlineTpl") && typeof c.use === "function") c.use("downloads").then(function(d){ downloads = d || null; document.getElementById("offBtn").hidden = !downloads; }).catch(function(){});
  }, none);
})();
})();
